name: Documentation Freshness Check

on:
  # Scheduled runs - weekly on Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_url_check:
        description: 'Skip external URL validation'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean

  # Run on PRs that modify documentation
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.doc-freshness.config.js'

concurrency:
  group: doc-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-freshness:
    name: Check Documentation Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache URL Validation Results
        uses: actions/cache@v5
        with:
          path: .doc-freshness-cache
          key: doc-freshness-urls-${{ github.run_id }}
          restore-keys: |
            doc-freshness-urls-

      - name: Run Documentation Freshness Check
        id: check
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.skip_url_check }}" == "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --skip-urls"
          fi
          if [ "${{ inputs.verbose }}" == "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --verbose"
          fi

          node dist/cli.js \
            --reporter markdown \
            --output .doc-freshness-reports/report.md \
            $EXTRA_ARGS || echo "has_issues=true" >> $GITHUB_OUTPUT

          node dist/cli.js \
            --reporter json \
            --output .doc-freshness-reports/report.json \
            $EXTRA_ARGS || true

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: doc-freshness-report
          path: .doc-freshness-reports/

      - name: Add PR Comment
        if: github.event_name == 'pull_request' && steps.check.outputs.has_issues == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { default: script } = await import('file://${{ github.workspace }}/.github/scripts/pr-comment.mjs');
            await script({ github, context });

      - name: Create/Update Tracking Issue (Scheduled Run)
        if: github.event_name == 'schedule' && steps.check.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { default: script } = await import('file://${{ github.workspace }}/.github/scripts/tracking-issue.mjs');
            await script({ github, context });

      - name: Write Job Summary
        if: always()
        run: |
          if [ -f .doc-freshness-reports/report.md ]; then
            cat .doc-freshness-reports/report.md >> $GITHUB_STEP_SUMMARY
          fi
